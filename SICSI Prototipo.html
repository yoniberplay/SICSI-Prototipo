// ---- Gráfico de línea (SVG, una sola escala) ----
function lineChart(hist, fc, opts={}){
  const W=640,H=230,L=44,R=14,T=14,B=30; const n=hist.length+fc.length;
  const all=[...hist,...fc]; const lo=Math.floor(Math.min(...all)/50)*50-50, hi=Math.ceil(Math.max(...all)/50)*50+20;
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g='';
  for(let v=Math.ceil(lo/50)*50; v<=hi; v+=50){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const labels = Array.from({length:n},(_,i)=>i);
  labels.filter(i=>i%3===0||i===n-1).forEach(i=>{ g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">S${i+1}</text>`; });
  const hp=hist.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const fp=[hist.length-1,...fc.map((_,i)=>hist.length+i)].map((i,k)=>`${x(i)},${y(k===0?hist[hist.length-1]:fc[k-1])}`).join(' ');
  const band = fc.map((v,i)=>`${x(hist.length+i)},${y(v*1.08)}`).concat(fc.map((v,i)=>`${x(hist.length+i)},${y(v*0.92)}`).reverse());
  band.unshift(`${x(hist.length-1)},${y(hist[hist.length-1])}`);
  const area = `${x(0)},${y(lo)} ${hp} ${x(hist.length-1)},${y(lo)}`;
  const ex = hist.length-1;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria||'Demanda semanal'}">
    ${g}
    <line x1="${x(ex)}" x2="${x(ex)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${x(ex)+6}" y="${T+10}">hoy</text>
    <polygon points="${area}" fill="var(--accent)" opacity=".08"/>
    <polygon points="${band.join(' ')}" fill="var(--warn)" opacity=".15"/>
    <polyline points="${hp}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
    <polyline points="${fp}" fill="none" stroke="var(--warn)" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="${x(ex)}" cy="${y(hist[ex])}" r="4" fill="var(--accent)"/>
  </svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>Ventas reales (und./semana)</span><span><i style="background:var(--warn)"></i>Pronóstico</span><span><i style="background:var(--warn);opacity:.3;height:8px"></i>Intervalo ±8 %</span></div></div>`;
}

  <div class="chips" role="group" aria-label="Tipo de alerta">${['Todas',...Object.keys(TIPO_ALERTA)].map(k=>`<button class="chip" data-falerta="${k}" aria-pressed="${k===f}">${k==='Todas'?'Todas':TIPO_ALERTA[k][0]}</button>`).join('')}</div>
  <div class="card">${list.map(a=>{const [t,c]=TIPO_ALERTA[a.tipo];const p=prodById(a.prod);return `<div class="alert-row"><span class="sev" style="background:var(--${c==='neutral'?'muted':c})"></span>
    <div class="body"><div class="toolbar"><span class="title">${p.nom}</span><span class="pill ${c}">${t}</span><span class="pill ${a.prio==='Alta'?'crit':a.prio==='Media'?'warn':'neutral'}">Prioridad ${a.prio.toLowerCase()}</span></div>
    <div class="muted" style="margin-top:4px">${esc(a.msg)}</div><div class="muted mono" style="margin-top:2px">ALR-${a.id} · ${ALM[a.alm-1].nom} · ${a.hace}</div></div>
    <div class="toolbar" style="flex:none">${a.estado==='Pendiente'?`${a.tipo==='StockMinimo'?'<a class="btn sm" href="#pronostico">Reabastecer</a>':''}<button class="btn sm primary" data-atender="${a.id}">Marcar atendida</button>`:'<span class="pill ok">Atendida</span>'}</div></div>`}).join('') || '<div class="card-b muted">No hay alertas de este tipo.</div>'}</div>`;
};

V.pronostico = () => `<div class="head"><div><h1>Pronóstico y reabastecimiento</h1><p>Modelo seleccionado por producto según el menor error (MAPE). Última ejecución: hoy, 6:00 a. m.</p></div><div class="actions"><button class="btn" data-toast="Pronóstico recalculado con datos al 08/11/2026 (simulado)">Recalcular</button></div></div>
  <div class="grid cols-2">
    <div class="card"><div class="card-h"><h2>Arroz selecto 10 lb · Almacén Central</h2><span class="muted">16 semanas reales + 6 pronosticadas</span></div><div class="card-b">${lineChart(HIST,FC)}</div></div>
    <div class="card"><div class="card-h"><h2>Parámetros del modelo</h2></div><div class="card-b"><dl class="dl">
      <dt>Método</dt><dd>Suavizamiento exponencial (Holt)</dd><dt>α / β</dt><dd class="num">0.35 / 0.10</dd><dt>MAPE (12 sem.)</dt><dd class="num"><span class="pill ok">6.4 %</span> meta ≤ 20 %</dd>
      <dt>Demanda próxima semana</dt><dd class="num">462 und.</dd><dt>Días de entrega</dt><dd class="num">3 días</dd><dt>Stock de seguridad</dt><dd class="num">20 und.</dd><dt>Punto de reorden</dt><dd class="num"><b>118 und.</b> = 462 ÷ 7 × 3 + 20</dd></dl></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Órdenes sugeridas</h2><span class="muted">${SUGERENCIAS.length} productos por debajo de su punto de reorden</span></div>
  <div class="tablewrap"><table><thead><tr><th>Producto</th><th>Almacén</th><th class="r">Existencia</th><th class="r">Punto de reorden</th><th class="r">Demanda 4 sem.</th><th>Proveedor</th><th class="r">Cantidad sugerida</th><th></th></tr></thead><tbody>
  ${SUGERENCIAS.map((s,i)=>{const p=prodById(s.prod);return `<tr><td>${p.nom}<div class="muted mono">${p.sku}</div></td><td>${ALM[s.alm-1].nom}</td><td class="r num">${fmt(s.stock)}</td><td class="r num">${fmt(s.pr)}</td><td class="r num">${fmt(s.dem*4)}</td><td>${s.prov}<div class="muted">${s.dias} días de entrega</div></td><td class="r"><input type="number" value="${s.cant}" min="1" style="width:90px;text-align:right" aria-label="Cantidad sugerida de ${esc(p.nom)}"></td><td><button class="btn sm primary" data-toast="Orden en borrador creada para ${esc(s.prov)}">Crear orden</button></td></tr>`}).join('')}
  </tbody></table></div></div>`;

V.ordenes = () => `<div class="head"><div><h1>Órdenes de compra</h1><p>Las órdenes sugeridas por el sistema se marcan con la etiqueta “Sugerida”.</p></div><div class="actions"><a class="btn" href="#pronostico">Ver sugerencias</a><button class="btn primary" data-toast="Nueva orden en borrador (simulado)">Nueva orden</button></div></div>
  <div class="grid kpis">
    ${[['Borrador',1],['Aprobadas / enviadas',2],['Recepción parcial',1],['Monto abierto',null]].map(([l,v])=>`<div class="card kpi"><span class="label">${l}</span><span class="val num">${v===null?rd(ORDENES.filter(o=>!['Recibida','Cancelada'].includes(o.estado)).reduce((a,o)=>a+o.total,0)).replace(/\.\d\d$/,''):v}</span></div>`).join('')}
  </div>
  <div class="card"><div class="tablewrap"><table><thead><tr><th>Número</th><th>Proveedor</th><th>Almacén</th><th>Fecha</th><th>Entrega esperada</th><th>Estado</th><th class="r">Total</th><th></th></tr></thead><tbody>
  ${ORDENES.map(o=>`<tr><td class="mono">${o.num}</td><td>${o.prov} ${o.sug?'<span class="pill info">Sugerida</span>':''}</td><td>${o.alm}</td><td class="num">${o.fecha}</td><td class="num">${o.entrega}</td><td><span class="pill ${EST_OC[o.estado]}">${o.estado}</span></td><td class="r num">${rd(o.total)}</td><td>${o.estado==='Borrador'?'<button class="btn sm primary" data-toast="Orden aprobada y lista para enviar">Aprobar</button>':o.estado==='Enviada'||o.estado==='Parcial'?'<a class="btn sm" href="#movimientos">Recibir</a>':'<button class="btn sm" data-toast="Vista PDF de la orden (simulado)">Ver</button>'}</td></tr>`).join('')}
  </tbody></table></div></div>`;

V.conteo = () => {
  if(!state.conteo) state.conteo = P.slice(0,8).map((p,i)=>({p,sis:p.stock[0],cont:[p.stock[0],p.stock[0]-2,p.stock[0],p.stock[0]+1,p.stock[0],p.stock[0],null,null][i]}));
  const done=state.conteo.filter(l=>l.cont!==null).length;
  return `<div class="head"><div><h1>Conteo físico CF-0058</h1><p>Conteo cíclico · Almacén Central · pasillos P01 a P04 · responsable: Luis Báez</p></div><div class="actions"><span class="pill warn">Abierto</span><button class="btn primary" id="closeCount" ${done<state.conteo.length?'disabled':''}>Cerrar y generar ajustes</button></div></div>
  <div class="card"><div class="card-h"><h2>Avance</h2><span class="muted num">${done} de ${state.conteo.length} productos contados</span></div><div class="card-b"><div class="bar" style="height:10px"><i style="width:${done/state.conteo.length*100}%;background:var(--accent)"></i></div></div>
  <div class="tablewrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Ubicación</th><th class="r">Según sistema</th><th class="r">Contado</th><th class="r">Diferencia</th></tr></thead><tbody>
  ${state.conteo.map((l,i)=>{const d=l.cont===null?null:l.cont-l.sis;return `<tr><td class="mono">${l.p.sku}</td><td>${l.p.nom}</td><td class="mono">P0${1+(i>>1)}-E${1+i%3}-N${1+i%4}</td><td class="r num">${fmt(l.sis)}</td><td class="r"><input type="number" min="0" data-cont="${i}" value="${l.cont===null?'':l.cont}" placeholder="—" style="width:90px;text-align:right" aria-label="Cantidad contada de ${esc(l.p.nom)}"></td><td class="r num ${d===null?'':d<0?'diff-neg':d>0?'diff-pos':'diff-0'}">${d===null?'—':d>0?'+'+fmt(d):fmt(d)}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
};

V.reportes = () => {
  const R=[['Valorización del inventario','Valor en RD$ por almacén, categoría y clase ABC, al costo promedio.','Diario'],['Rotación de inventario','Veces que rota cada producto y días de inventario por categoría.','Mensual'],['Kárdex por producto','Entradas, salidas y saldo de un producto en un período.','A demanda'],['Quiebres de stock','Productos agotados por semana y ventas estimadas perdidas.','Semanal'],['Precisión del pronóstico','MAPE por producto y método; comparación pronóstico contra venta real.','Semanal'],['Diferencias de conteo','Diferencias encontradas en conteos físicos y ajustes aplicados.','Por conteo']];
  return `<div class="head"><div><h1>Reportes</h1><p>Los reportes se generan con los filtros de almacén y período, y se exportan a Excel o PDF.</p></div></div>
  <div class="card card-b toolbar"><div class="field"><label for="desde">Desde</label><input id="desde" type="date" value="2026-10-01"></div><div class="field"><label for="hasta">Hasta</label><input id="hasta" type="date" value="2026-11-08"></div><div class="field"><label for="catR">Categoría</label><select id="catR"><option>Todas</option><option>Alimentos</option><option>Limpieza</option><option>Ferretería</option></select></div></div>
  <div class="grid cols-3">${R.map(r=>`<div class="card report"><h3>${r[0]}</h3><p class="muted" style="margin:0">${r[1]}</p><span class="pill neutral">${r[2]}</span><div class="row"><button class="btn sm" data-toast="${r[0]}: Excel generado (simulado)">Excel</button><button class="btn sm" data-toast="${r[0]}: PDF generado (simulado)">PDF</button></div></div>`).join('')}</div>`;
};

V.usuarios = () => {
  const roles=[['Administrador','Todo el sistema, usuarios y parámetros'],['Gerente','Tablero, reportes y aprobación de órdenes'],['Compras','Proveedores, pronóstico y órdenes de compra'],['Almacén','Movimientos y conteos de su almacén'],['Auditor','Solo lectura y bitácora de auditoría']];
  return `<div class="head"><div><h1>Usuarios y roles</h1><p>Cada acción queda registrada en la bitácora de auditoría con usuario, fecha y hora.</p></div><div class="actions"><button class="btn primary" data-toast="Invitación enviada (simulado)">Agregar usuario</button></div></div>
  <div class="grid cols-2">
    <div class="card"><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Almacén</th><th>Estado</th><th>Último acceso</th></tr></thead><tbody>
    ${USERS.map(u=>`<tr><td>${u[0]}<div class="muted">${u[1]}</div></td><td>${u[2]}</td><td>${u[3]}</td><td><span class="pill ${u[4]==='Activo'?'ok':'neutral'}">${u[4]}</span></td><td class="num">${u[5]}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Roles y permisos</h2></div>${roles.map(r=>`<div class="alert-row"><div class="body"><div class="title">${r[0]}</div><div class="muted">${r[1]}</div></div></div>`).join('')}</div>
  </div>`;
};

// ---- Enrutador por hash (#nombre) ----
function route(){
  const h=(location.hash||'').replace('#','');
  const r = V[h] ? h : 'inicio';
  const root=document.getElementById('root');
  root.innerHTML = r==='login' ? V.login() : shell(r, V[r]());
  document.title = r==='login' ? 'SICSI Prototipo' : TITLES[r]+' · SICSI';
  window.scrollTo(0,0);
}
function rerender(){ const y=window.scrollY; route(); window.scrollTo(0,y); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function addCode(code){
  const p=prodByCb(code.trim()); const err=document.getElementById('scanErr');
  if(!p){ err.textContent=`No existe un producto con el código “${code}”. Verifique el código o regístrelo en Productos.`; err.hidden=false; return; }
  const l=state.lines.find(x=>x.p.id===p.id); if(l) l.cant++; else state.lines.push({p,cant:1});
  rerender(); const inp=document.getElementById('scanInput'); if(inp) inp.focus();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,tr'); if(!t) return;
  if(t.dataset.toast){ toast(t.dataset.toast); return; }
  if(t.dataset.prod){ state.prod=+t.dataset.prod; if(t.tagName==='TR'){ location.hash='producto'; } return; }
  if(t.dataset.cat){ state.cat=t.dataset.cat; rerender(); return; }
  if(t.dataset.tipo){ state.tipoMov=t.dataset.tipo; rerender(); return; }
  if(t.dataset.falerta){ state.filtroAlerta=t.dataset.falerta; rerender(); return; }
  if(t.dataset.atender){ const a=ALERTAS.find(x=>x.id==t.dataset.atender); a.estado='Atendida'; rerender(); toast('Alerta marcada como atendida'); return; }
  if(t.dataset.cb){ addCode(t.dataset.cb); return; }
  if(t.dataset.del){ state.lines.splice(+t.dataset.del,1); rerender(); return; }
  if(t.id==='clearLines'){ state.lines=[]; rerender(); return; }
  if(t.id==='saveMov'){ const n=state.lines.length; state.lines=[]; rerender(); toast(`Movimiento MOV-27582 guardado con ${n} línea(s). Stock actualizado.`); return; }
  if(t.id==='closeCount'){ toast('Conteo cerrado. Se generó el ajuste AJU-0412.'); return; }
});
document.addEventListener('keydown',e=>{ const tr=e.target.closest&&e.target.closest('tr[data-prod]'); if(tr&&e.key==='Enter'){ state.prod=+tr.dataset.prod; location.hash='producto'; }});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){ const ok=document.getElementById('email').value&&document.getElementById('pass').value; if(ok) location.hash='inicio'; else document.getElementById('loginErr').hidden=false; }
  if(e.target.id==='scanForm'){ const v=document.getElementById('scanInput').value; if(v) addCode(v); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='almSel'){ state.alm=+e.target.value; rerender(); }
  if(e.target.dataset.line){ state.lines[+e.target.dataset.line].cant=Math.max(1,+e.target.value||1); rerender(); }
  if(e.target.dataset.cont!==undefined){ const v=e.target.value; state.conteo[+e.target.dataset.cont].cont = v===''?null:+v; rerender(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ state.q=e.target.value; const pos=e.target.selectionStart; rerender(); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); }});
window.addEventListener('hashchange',route);
route();
})();
</script>

</body></html>
